services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adslott
      POSTGRES_PASSWORD: adslott
      POSTGRES_DB: adslott
    ports:
      - "5432:5432"
    volumes:
      - adslott_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adslott"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adslott_postgres_data:
